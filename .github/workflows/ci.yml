name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.ex"
      - "**/*.exs"
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - ".tool-versions"
      - "config/**"
      - "lib/**"
      - "test/**"
      - "native/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/parity-monitor.yml"
  pull_request:
    paths:
      - "**/*.ex"
      - "**/*.exs"
      - "mix.exs"
      - "mix.lock"
      - ".formatter.exs"
      - ".tool-versions"
      - "config/**"
      - "lib/**"
      - "test/**"
      - "native/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/parity-monitor.yml"

jobs:
  parity-monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parity monitor lifecycle tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1.1"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch deps
        run: mix deps.get
      - name: Check Elixir formatting
        run: mix format --check-formatted
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: native/iree_tokenizers_native

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      IREE_TOKENIZERS_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1.1"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch deps
        run: mix deps.get
      - name: Native crate tests
        run: cargo test
        working-directory: native/iree_tokenizers_native
      - name: Run tests
        run: mix test
