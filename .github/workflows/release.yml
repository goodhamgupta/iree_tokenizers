name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example: v0.8.17)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version change and resolve release commit
        id: plan
        run: python3 .github/scripts/prepare_release.py
      - name: Create GitHub release if needed
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2> release-error.txt; then
            exit 0
          fi
          # Do not mistake authentication or service failures for a missing release.
          if ! grep -qi 'release not found\|HTTP 404' release-error.txt; then
            cat release-error.txt >&2
            exit 1
          fi
          args=(--repo "$GH_REPO" --target "$SHA" --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"

  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    # Serialize the whole pipeline for one version, including manual retries.
    # Different versions can build without cancelling each other's releases.
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-package.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
